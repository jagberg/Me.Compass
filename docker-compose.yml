services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "51789:51789"
    # All config comes from the root .env (identity, Google, JIRA, ESS). DATA_DIR is overridden
    # to the container volume path.
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
    volumes:
      - action-data:/data

volumes:
  action-data:
